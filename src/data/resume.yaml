summary: |
  Software Engineer and Google Cloud Certified Professional Cloud Architect with {{years}}+ years architecting distributed systems, cloud infrastructure, and production agentic workflows. At Google, my work centers on enterprise cloud architecture and agentic AI systems (ADK, Gemini Enterprise), built on a strong foundation of engineering high-throughput darknet intelligence collection platforms. Proven track record in designing resilient GCP infrastructure, building autonomous agent workflows, and eliminating operational bottlenecks.

experience:
  - company: "Google"
    role: "Software Engineer"
    from: "Aug. 2022"
    to: "Present"
    location: "Pune, IN"
    highlights:
      - "Architect enterprise cloud solutions and production agentic workflows on Google Cloud, leveraging the Agent Development Kit (ADK) and Gemini Enterprise to build secure, autonomous systems."
      - "Architected and scaled distributed darknet intelligence collection platforms on GCP, expanding data ingestion capacity across complex sources with zero-downtime reliability."
      - "Eliminated a high-friction manual engineering workflow by deploying an LLM-agent-driven code generation pipeline, reducing operational effort by 70%."
      - "Built a proactive observability and triage engine powered by Looker and BigQuery agents, establishing real-time pipeline monitoring and reducing manual debugging overhead by 75%."
      - "Engineered a centralized custom library adopted across backend systems, reducing codebase duplication by 30% while standardizing reliability and security guardrails."

  - company: "One Convergence Pvt. Ltd"
    role: "Software Developer"
    from: "Feb. 2020"
    to: "Jul. 2022"
    location: "Hyderabad, IN"
    highlights:
      - "Built a CLI automation tool in Python, Bash, and Terraform to streamline VM provisioning across multi-cloud environments, integrated with a React dashboard for centralized infrastructure management."
      - "Stepped up as interim engineering lead — owned code reviews, coordinated releases, and unblocked UI feature deliveries during a critical project phase."
      - "Led a zero-downtime migration from NoSQL to SQL for the core product database, improving query performance and data consistency for production workloads."
      - "Designed and shipped high-performance Go APIs enabling cross-team collaboration between UI and ML departments, reducing integration lag across teams."
      - "Guided multiple clients through Kubernetes and Helm-based cloud-native migrations, providing hands-on technical leadership on container orchestration and workload transition."

  - company: "De-Haze Labs"
    role: "Software Engineer"
    from: "Jul. 2018"
    to: "Aug. 2019"
    location: "Remote, US"
    highlights:
      - "Engineered high-throughput web crawlers in Python/Scrapy to automate large-scale data collection with optimized resource utilization."
      - "Integrated Dialogflow-based conversational interfaces to bridge automated data pipelines with customer-facing workflows."
      - "Drove R&D efforts to prototype new product features, several of which were adopted into the product roadmap."

